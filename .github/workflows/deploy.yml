name: Deploy toko.marica.id

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          rm -rf app/generated/prisma
          npx prisma generate --schema=prisma/schema.prisma
          node -e "const fs=require('fs'); const d=fs.readFileSync('app/generated/prisma/index.d.ts','utf8'); for (const name of ['b2BInquiry','playpassBooking','subscription','subscriptionActivity','childProfile']) { if (!d.includes('get '+name+'()')) throw new Error('Prisma delegate missing: '+name); }"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Prepare deployment
        run: |
          mkdir -p deploy/.next
          mkdir -p deploy/tmp

          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public

          # Trigger Passenger restart after FTP upload
          date -u +%s > deploy/tmp/restart.txt

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./deploy/
          protocol: ftp
          port: 21
